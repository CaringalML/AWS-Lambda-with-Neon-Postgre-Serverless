name: Cleanup v2 Leftovers

# The v2 stack in ap-southeast-2 outlived its Terraform state bucket, so it
# cannot be destroyed with terraform. This removes its resources by direct API
# call, from an explicit allow-list of exact identifiers.
#
# Defaults to plan. Nothing is deleted unless mode is set to apply.

env:
  AWS_REGION: ap-southeast-2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan lists what would go; apply actually deletes'
        type: choice
        required: true
        options:
          - plan
          - apply
        default: plan
      confirm:
        description: 'For apply only — type "cleanup-v2" exactly'
        required: false
        default: ''

jobs:
  cleanup:
    name: Cleaning v2 (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check confirmation for apply
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "cleanup-v2" ]; then
            echo "::error::apply requires the confirmation phrase. Nothing was deleted."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run cleanup
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          pip install --quiet boto3
          python3 .github/scripts/cleanup_v2.py

      - name: Remaining Environment=dev resources in this region
        if: always()
        run: |
          {
            echo ""
            echo "## Still tagged Environment=dev in ${AWS_REGION}"
            echo ""
            echo '```'
            aws resourcegroupstaggingapi get-resources \
              --tag-filters Key=Environment,Values=dev \
              --query 'ResourceTagMappingList[].ResourceARN' --output text \
              | tr '\t' '\n' | grep -v '^$' || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

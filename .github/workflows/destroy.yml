name: Destroy Infrastructure

env:
  TARGET_BRANCH: v3-novadrive
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.6.6

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm full infrastructure teardown'
        required: true

jobs:
  destroy:
    name: Destroying ${{ env.TARGET_BRANCH }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Confirm destruction
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "Confirmation input was '${{ github.event.inputs.confirm }}', expected 'destroy'."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -migrate-state -force-copy

      - name: Terraform Destroy
        env:
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_cognito_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_cognito_admin_password: ${{ secrets.ADMIN_PASSWORD }}
        run: terraform destroy -auto-approve

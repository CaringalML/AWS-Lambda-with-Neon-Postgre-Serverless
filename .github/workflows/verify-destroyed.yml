name: Verify Destroyed

# Read-only audit. Every AWS call is a list/describe — nothing is modified.

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.6

on:
  workflow_dispatch:

jobs:
  verify:
    name: Auditing ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform state must be empty
        run: |
          terraform init -input=false > /dev/null
          COUNT=$(terraform state list 2>/dev/null | wc -l)
          {
            echo "## Terraform state"
            echo ""
            echo "resources still tracked: **$COUNT**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" != "0" ]; then
            {
              echo ""
              echo '```'
              terraform state list
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "state_count=$COUNT" >> "$GITHUB_ENV"

      - name: Sweep AWS for anything left
        run: |
          pip install --quiet boto3
          python3 .github/scripts/audit_destroyed.py

      - name: Verdict
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${state_count:-1}" = "0" ] && [ "${sweep_found:-1}" = "0" ] && [ "${probe_errors:-1}" = "0" ]; then
            echo "### Verdict: CLEAN — nothing from the stack remains" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Verdict: NOT CLEAN — state=$state_count sweep=$sweep_found errors=$probe_errors" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

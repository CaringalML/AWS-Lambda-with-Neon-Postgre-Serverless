name: Deploy Infrastructure

# EDIT ONLY THIS LINE
env:
  TARGET_BRANCH: v3-novadrive  # Switch to 'hello-world', 'CRUD', 'auth', 'novadrive', 'v2-novadrive', or 'v3-novadrive' as needed.
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.6
  PYTHON_VERSION: "3.12"

on:
  push:
    # EDIT THIS to match TARGET_BRANCH above
    branches: ["v3-novadrive"]
  pull_request:
    branches: ["v3-novadrive"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploying ${{ github.ref_name }}
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Lambda dependencies
        run: |
          LAMBDA_DIR="lambda/serverless_web_app"
          if [ -f "$LAMBDA_DIR/requirements.txt" ]; then
            # Install into Lambda folder for packaging
            pip install -r "$LAMBDA_DIR/requirements.txt" -t "$LAMBDA_DIR/" --upgrade --no-cache-dir
            # Install into system Python so manage.py can import them during migrations
            pip install -r "$LAMBDA_DIR/requirements.txt" --upgrade --no-cache-dir
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -migrate-state -force-copy

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_cognito_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_cognito_admin_password: ${{ secrets.ADMIN_PASSWORD }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan \`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>
            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            </details>
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push batch worker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: lambda/serverless_web_app
          file: lambda/serverless_web_app/batch/Dockerfile
          push: true
          tags: rencecaringal000/novadrive-batch:latest

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
          TF_VAR_cognito_admin_email: ${{ secrets.ADMIN_EMAIL }}
          TF_VAR_cognito_admin_password: ${{ secrets.ADMIN_PASSWORD }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "========================================"
          echo "    DEPLOYED BRANCH: ${{ env.TARGET_BRANCH }}"
          echo "========================================"
          terraform output -no-color
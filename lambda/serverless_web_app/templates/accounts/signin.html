{% extends "base.html" %}

{% block title %}Admin Login - NovaDrive{% endblock %}

{% block content %}
<div class="w-full max-w-md">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold">Admin Login</h1>
    </div>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-8">
        <form method="post" class="space-y-4" x-data="{ loading: false }" @submit="loading = true">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="bg-red-900/40 border border-red-600 rounded-lg px-4 py-3 text-red-300 text-sm">
                {% for error in form.non_field_errors %}{{ error }}{% endfor %}
            </div>
            {% endif %}

            <div>
                <label class="block text-sm text-slate-400 mb-1">Email</label>
                {{ form.email }}
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-primary mt-2" :disabled="loading">
                <span class="spinner" x-show="loading" x-cloak></span>
                <span x-text="loading ? 'Logging in…' : 'Log in'">Log in</span>
            </button>
        </form>
    </div>

</div>
{% endblock %}
